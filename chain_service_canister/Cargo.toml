[package]
name = "chain_service_canister"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.17"
ic-cdk-macros = "0.17"
ic-stable-structures = "0.6.8"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
bincode = "1.3"
ic-cdk-timers = "0.7"
evm_logs_types = { path = "../evm_logs_types" }
canister_utils = { path = "../canister_utils" }
evm-rpc-client = { path = "../evm-rpc-client" }
evm_rpc_types = "1.4.0"
ic-canister-log = "0.2.0"
hex = "0.4"
ic-metrics-encoder = "1"
num-traits = "0.2"
futures = "0.3"


[build-dependencies]
ic-cdk-bindgen = "0.1"
