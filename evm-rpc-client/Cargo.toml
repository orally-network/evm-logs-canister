[package]
name = "evm-rpc-client"
description = "Client for the EVM-RPC canister"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
candid = "0.10"
evm_rpc_types = "1.3.0"
ic-canister-log = "0.2.0"
ic-cdk = "0.17"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
mockall = "0.12"
tokio = { version = "1.0", features = ["full"] }
